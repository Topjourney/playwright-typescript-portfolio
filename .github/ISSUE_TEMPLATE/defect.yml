name: Defect report
description: Report an observable product problem with reproducible evidence
title: '[Defect]: '
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not include passwords, tokens or customer data.
  - type: input
    id: requirement
    attributes:
      label: Business requirement or test ID
      description: Example BR-04 or QA-CHK-002
      placeholder: BR-00 / QA-AREA-000
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — core journey unavailable or serious security/data risk
        - High — major journey impaired with no reasonable workaround
        - Medium — behaviour incorrect but a workaround exists
        - Low — minor usability or presentation problem
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions and test data
      description: Describe state without entering secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Enter...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and business impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link the relevant trace, screenshot, video, report or workflow run.
